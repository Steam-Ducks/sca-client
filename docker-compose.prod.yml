services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: frontend_app
    ports:
      # Porta do host configurável (padrão 80). Defina FRONTEND_PORT no .env
      # do servidor para evitar conflito com outro serviço na 80.
      - "${FRONTEND_PORT:-80}:80"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
