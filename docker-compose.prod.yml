services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: frontend_app
    ports:
      # Porta do host configurável (padrão 5173, evita conflito com a 80 já
      # em uso no servidor). Sobrescreva com FRONTEND_PORT no .env do servidor.
      - "${FRONTEND_PORT:-5173}:80"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
