name: Scheduled Merge to Main

on:
  schedule:
    # 05/04/2026 - 12:00 UTC
    - cron: '0 12 5 4 *'
    # 03/05/2026 - 12:00 UTC
    - cron: '0 12 3 5 *'
    # 31/05/2026 - 12:00 UTC
    - cron: '0 12 31 5 *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-date:
    name: Verify Scheduled Date
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Check if today is a scheduled merge date
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$TODAY" == "2026-04-05" || "$TODAY" == "2026-05-03" || "$TODAY" == "2026-05-31" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: check-date
    if: needs.check-date.outputs.should_run == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Unit Tests with Coverage
        run: npm run test -- --coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run E2E Tests
        run: npm run test:e2e

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Tests with Coverage
        run: npm run test -- --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  merge-to-main:
    name: Merge develop into main
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, sonarcloud]
    if: success()

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into main
        run: |
          git fetch origin develop
          git merge origin/develop --no-ff -m "chore: scheduled merge develop into main [$(date -u +%Y-%m-%d)]"
          git push origin main
