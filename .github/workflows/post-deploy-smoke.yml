name: post-deploy-smoke

# Roda DEPOIS do automatic-deploy concluir, não em paralelo com ele.
# Disparar direto no push testava a versão antiga, pois o build+deploy
# na VPS ainda não havia terminado.
on:
  workflow_run:
    workflows: ["automatic-deploy"]
    types:
      - completed
  workflow_dispatch:

jobs:
  smoke-frontend:
    name: Frontend (Playwright)
    runs-on: ubuntu-latest
    # Só roda se o deploy passou (ou em disparo manual).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run frontend smoke test
        env:
          PROD_FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
