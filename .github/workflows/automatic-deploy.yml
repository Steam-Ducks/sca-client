name: automatic-deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -e
            cd /home/deploy/sca-client

            # Sincroniza com origin/main de forma determinística (descarta
            # qualquer estado local do diretório de deploy).
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Derruba o stack atual (e órfãos) para liberar a porta 80
            # antes de recriar — evita "address already in use".
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml up -d --build
