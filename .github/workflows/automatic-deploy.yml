name: automatic-deploy

on:
  push:
    branches:
      - main

# Evita dois deploys concorrentes em pushes próximos. Não cancela o que
# já está rodando para não interromper um build/deploy em andamento.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -e
            cd /root/sca-client

            # Sincroniza com origin/main de forma determinística (descarta
            # qualquer estado local do diretório de deploy).
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            docker compose -f docker-compose.prod.yml up -d --build
