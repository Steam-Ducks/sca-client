name: CI - Feature Branch

on:
  pull_request:
    branches: [develop]

jobs:

  # ─── 1. Lint + Type check ────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  # ─── 2. Unit Tests ──────────────────────────────────────────────────────────
  # Vitest com vi.mock() — nenhuma chamada HTTP real.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run unit tests with coverage
        run: npm run test -- --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-client
          path: coverage/
          retention-days: 30

  # ─── 3. E2E Integration Tests ───────────────────────────────────────────────
  # Playwright + Django real + PostgreSQL.
  # Nenhuma rota é interceptada (sem page.route mock) — API real responde.
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-secret-key
      DEBUG: "1"    # ← MUDAR de "0" para "1" (habilita CORS_ALLOW_ALL_ORIGINS)
      ALLOWED_HOSTS: localhost,127.0.0.1
      VITE_API_BASE_URL: http://localhost:8000/api
      PLAYWRIGHT_BACKEND_AVAILABLE: "true"    # ← ADICIONAR (ativa CT-LOGIN-02/06 e CT-ROLE-08/09)

    steps:
      - uses: actions/checkout@v4

      # ── Backend ───────────────────────────────────────────────────────────────
      - name: Checkout sca-server
        uses: actions/checkout@v4
        with:
          repository: Steam-Ducks/sca-server
          path: sca-server
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install --upgrade pip && pip install -r sca-server/requirements.txt

      - name: Create PostgreSQL schemas
        run: |
          PGPASSWORD=${{ env.DB_PASSWORD }} psql \
            -h ${{ env.DB_HOST }} -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} \
            -c "CREATE SCHEMA IF NOT EXISTS silver;
                CREATE SCHEMA IF NOT EXISTS gold;
                CREATE SCHEMA IF NOT EXISTS audit;"

      - name: Run backend migrations
        working-directory: sca-server
        run: python manage.py migrate

      - name: Start Django backend
        working-directory: sca-server
        run: |
          python manage.py runserver 8000 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/api/health/ && echo "Backend pronto." && break || sleep 2
          done

      # ── Frontend ──────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api

      # Serve o build em localhost:4173 para o Playwright acessar.
      # playwright.config.ts define webServer: undefined no CI —
      # o servidor precisa estar no ar antes do test:e2e ser chamado.
      - name: Start frontend preview server
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:4173 && echo "Frontend pronto." && break || sleep 2
          done

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Step Summary
        if: always()
        run: |
          echo "## E2E Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| PR | #${{ github.event.pull_request.number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | Django localhost:8000 |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | Vite preview localhost:4173 |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Chromium headless |" >> $GITHUB_STEP_SUMMARY
          echo "> Relatório com screenshots: **Actions → playwright-report**" >> $GITHUB_STEP_SUMMARY
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          ICON=$([ "$STATUS" = "success" ] && echo ":white_check_mark:" || echo ":x:")
          COLOR=$([ "$STATUS" = "success" ] && echo "good" || echo "danger")
          REPORT_URL="https://Steam-Ducks.github.io/sca-client/"
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"title\": \"$ICON E2E Tests — PR #${PR_NUMBER}\",
                \"title_link\": \"https://github.com/${REPO}/pull/${PR_NUMBER}\",
                \"fields\": [
                  {\"title\": \"Status\",    \"value\": \"$STATUS\",  \"short\": true},
                  {\"title\": \"Branch\",    \"value\": \"$BRANCH\",  \"short\": true},
                  {\"title\": \"Relatório\", \"value\": \"<${REPORT_URL}|Ver no GitHub Pages>\", \"short\": false}
                ],
                \"footer\": \"SCA Frontend CI\",
                \"ts\": $(date +%s)
              }]
            }"


  # ─── 4. Branch & Commit Policy ──────────────────────────────────────────────
  # Precisam estar neste workflow (não em branch-commit-policy.yml) para que o
  # auto-merge consiga depender deles via `needs` — `needs` não enxerga jobs de
  # outro workflow. Sem isso o merge automático não era bloqueado.
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name pattern
        uses: deepakputhraya/action-branch-name@master
        with:
          regex: '^(SCA|DEVOPS|FIX)-[0-9]+-[A-Za-z0-9._-]+$'
          ignore: develop,main
          min_length: 7
          max_length: 80

  commit-messages:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message format
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          header_regex='^(feat|fix|chore|docs|refactor|test|perf|ci|build|style|revert)\((SCA|DEVOPS)-[0-9]+\): .+$'
          max_len=100
          fail=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            subject=$(git log -1 --format=%s "$sha")
            parents=$(git log -1 --format=%P "$sha" | wc -w)
            if [ "$parents" -gt 1 ]; then
              echo "skip merge $sha: $subject"
              continue
            fi
            if [[ ! "$subject" =~ $header_regex ]]; then
              echo "::error::Invalid format ($sha): $subject"
              echo "  expected: <type>(SCA-NNN|DEVOPS-NNN): <description>"
              echo "  types: feat|fix|chore|docs|refactor|test|perf|ci|build|style|revert"
              fail=1
              continue
            fi
            if [ "${#subject}" -gt "$max_len" ]; then
              echo "::error::Subject too long (${#subject} > $max_len) ($sha): $subject"
              fail=1
            fi
            if [[ "$subject" == *. ]]; then
              echo "::error::Subject ends with period ($sha): $subject"
              fail=1
            fi
            echo "ok $sha: $subject"
          done
          exit $fail

  # ─── 5. Auto-merge ──────────────────────────────────────────────────────────
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, branch-name, commit-messages]
    if: success()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Enable Auto Merge
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
